apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  suspend: false
  interval: 45m
  # 5m default is too tight for the arm64 image pulls on the oracle nodes;
  # the 1.19.11 upgrade timed out at 5m and Flux rolled back to 1.18.9.
  timeout: 15m
  chart:
    spec:
      chart: cilium
      version: 1.19.11
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
    # - kind: Secret
    #   name: cilium-ca-cert
    #   valuesKey: ca-secret
    #   optional: false
