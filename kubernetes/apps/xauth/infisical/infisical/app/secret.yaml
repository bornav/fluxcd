---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Infisical core secrets (session/encryption keys + db creds). Was a SOPS
# Secret; now clusters/prod KV entry prod/xauth/infisical-secrets (dashed keys
# via index).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: infisical-secrets
    template:
      engineVersion: v2
      data:
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        ENCRYPTION_KEY: "{{ .ENCRYPTION_KEY }}"
        postgres-password: '{{ index . "postgres-password" }}'
        redis-password: '{{ index . "redis-password" }}'
        replication-password: '{{ index . "replication-password" }}'
        userpassword: "{{ .userpassword }}"
  dataFrom:
    - extract:
        key: prod/xauth/infisical-secrets
