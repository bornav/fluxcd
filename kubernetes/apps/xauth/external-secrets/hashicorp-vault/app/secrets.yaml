---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# restic target for the hashicorp-vault data volume backup (volsync). Was a
# SOPS Secret; now clusters/prod KV entry prod/xauth/restic-hashicorp-vault-data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-hashicorp-vault-data
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: restic-hashicorp-vault-data
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: "{{ .RESTIC_REPOSITORY }}"
  dataFrom:
    - extract:
        key: prod/xauth/restic-hashicorp-vault-data
