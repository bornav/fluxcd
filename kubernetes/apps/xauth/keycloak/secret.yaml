---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Keyrealm client/db credentials consumed by the Keycloak CR + realm import.
# Was a SOPS Secret; now clusters/prod KV entry prod/xauth/keycloak-auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-auth
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: keycloak-auth
    template:
      engineVersion: v2
      data:
        KEYCLOAK_ADMIN_PASSWORD: "{{ .KEYCLOAK_ADMIN_PASSWORD }}"
        databse_name: "{{ .databse_name }}"
        host: "{{ .host }}"
        password: '{{ index . "password" }}'
        port: "{{ .port }}"
        username: "{{ .username }}"
  dataFrom:
    - extract:
        key: prod/xauth/keycloak-auth
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# CNPG superuser for the keycloak postgres cluster. Was a SOPS Secret; now
# clusters/prod KV entry prod/xauth/keycloak-pg-superuser.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-pg-superuser
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: keycloak-pg-superuser
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: prod/xauth/keycloak-pg-superuser
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# S3 (rustfs) credentials for CNPG cloud backups of the keycloak db. Was a
# SOPS Secret; now clusters/prod KV entry prod/xauth/rustfs-cnpg-cloud-token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-cnpg-cloud-token
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: rustfs-cnpg-cloud-token
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: prod/xauth/rustfs-cnpg-cloud-token
