---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Cloudflare API token for the DNS-01 solvers in cert-manager issuers. Was a
# SOPS Secret; now clusters/prod KV entry prod/xauth/cloudflare-token-secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-token-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: cloudflare-token-secret
    template:
      engineVersion: v2
      data:
        cloudflare-token: '{{ index . "cloudflare-token" }}'
  dataFrom:
    - extract:
        key: prod/xauth/cloudflare-token-secret
