---
# Push gateway (Sygnal) for matrix.icylair.com.
# Sygnal is stateless (no database): it fans synapse's POSTs from
# /_matrix/push/v1/notify out to pushkins (webpush now; APNs/FCM when creds
# exist). NOTE: sygnal refuses to start with zero pushkins, so `apps:` must
# never be empty -- the credential-free webpush pushkin is always configured.
---
# VAPID signing key for the webpush pushkin. NEW secret generated during this
# change (openssl P-256), stored in Vault at
# secret/matrix-sygnal-local/sygnal-vapid (field vapid_private_key_pem);
# nothing existing was rotated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sygnal-secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend-cross-namespaces-secret
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: sygnal-secrets
  data:
    - secretKey: vapid_private_key_pem
      remoteRef:
        key: matrix-sygnal-local/sygnal-vapid
        property: vapid_private_key_pem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sygnal-config
data:
  sygnal.yaml: |
    log:
      setup:
        version: 1
        formatters:
          normal:
            format: "%(asctime)s [%(process)d] %(levelname)-5s %(name)s %(message)s"
        handlers:
          stdout:
            class: "logging.StreamHandler"
            formatter: "normal"
            stream: "ext://sys.stdout"
        root:
          handlers: ["stdout"]
          level: "INFO"
        disable_existing_loggers: false
      access:
        # Behind traefik, which sets X-Forwarded-For.
        x_forwarded_for: true

    http:
      bind_addresses: ['0.0.0.0']
      port: 5000

    metrics:
      prometheus:
        enabled: false

    # Add FCM/APNs pushkin entries here when credentials exist (classic
    # Element mobile push):
    # apps:
    #   im.vector.app.android:
    #     type: gcm
    #     project_id: ...
    #     service_account_file: /etc/sygnal/fcm-service-account.json
    #   im.vector.app.ios:
    #     type: apns
    #     keyfile: ... key_id: ... team_id: ... topic: ...
    #
    # Sygnal refuses to start with zero pushkins, so the credential-free
    # webpush pushkin is always present. Element Web (v1.12.x) does not
    # register webpush pushers, so nothing hits it today; it keeps sygnal
    # healthy and is the hook for web push if the client ever supports it.
    apps:
      org.matrix.webpush:
        type: webpush
        # PEM file rendered from the sygnal-secrets Secret (ExternalSecret),
        # projected next to this config file.
        vapid_private_key: /etc/sygnal/vapid_private.pem
        vapid_contact_email: admin@icylair.com
        # Only relay to well-known browser push services.
        allowed_endpoints:
          - "updates.push.services.mozilla.com"
          - "*.updates.push.services.mozilla.com"
          - "fcm.googleapis.com"
          - "*.notify.windows.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sygnal
  labels:
    app.kubernetes.io/name: sygnal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sygnal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sygnal
    spec:
      containers:
        - name: sygnal
          image: matrixdotorg/sygnal:v0.17.0
          env:
            - name: SYGNAL_CONF
              value: /etc/sygnal/sygnal.yaml
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/sygnal
              readOnly: true
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: sygnal-config
              - secret:
                  name: sygnal-secrets
                  items:
                    - key: vapid_private_key_pem
                      path: vapid_private.pem
---
apiVersion: v1
kind: Service
metadata:
  name: sygnal
  labels:
    app.kubernetes.io/name: sygnal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sygnal
  ports:
    - name: http
      port: 5000
      targetPort: http
