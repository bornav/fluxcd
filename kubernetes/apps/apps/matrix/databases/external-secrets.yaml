---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# CNPG bootstrap + Synapse externalPostgresql.existingSecret + MAS database.password_file
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-ext-new
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: synapse-ext-new
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
# KEEP the value even on cloud: bootstrap.recovery does NOT re-sync the
# `synapse` role password, so the restored DB keeps the password from this entry
# (sha 9f1e9a7306e1). The prod-era path held a different value and would break
# every consumer. Value copied byte-identical from
# secret/matrix-synapse-local/postgres-synapse-user into the clusters mount —
# no rotation. Name is historical, value is canonical.
  dataFrom:
    - extract:
        key: prod/apps/synapse-ext-new
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-pg-superuser
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: synapse-pg-superuser
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: prod/apps/synapse-pg-superuser
---
# (dropped: minio-synapse-pg-backup-secrets ES — dead minio, nothing consumes it)
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Synapse signing key. Value lives in Vault: clusters/prod/apps/synapse-signing-key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signing-key
spec:
  refreshInterval: 5m
  # Same leaf name as the local cluster's clusters/local/applications/synapse-signing-key
  # (byte-identical value, sha256 0c1b9de8…). No rotation = existing signatures stay valid.
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: signing-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/apps/synapse-signing-key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# App-level secrets (no plaintext in git). Mounted as files:
#   Synapse: macaroon_secret_key_path / matrix_authentication_service.secret_path
#   MAS:     upstream_oauth2 client_secret_file / matrix secret_file
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-app-secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: synapse-app-secrets
    creationPolicy: Owner
  # Vault entry already carries the final field names (macaroon_secret_key,
  # mas_secret, upstream_client_secret) — copied byte-identical from the three
  # secret/matrix-synapse/* keys.
  dataFrom:
    - extract:
        key: prod/apps/synapse-app-secrets
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# mautrix-whatsapp bridge: full config.yaml rendered in the Secret template so
# no token/DSN ever appears in git (the readable config shape stays in git; Vault
# prod/apps/whatsapp-bridge holds only the token fields). The as/hs/sender tokens
# are bound into the restored synapse DB and the WhatsApp session — values copied
# byte-identical from the historical matrix-synapse-local/* path; canonical.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whatsapp-bridge-config
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: whatsapp-bridge-config
    template:
      engineVersion: v2
      data:
        config.yaml: |
          bridge:
            command_prefix: '!wa'
            personal_filtering_spaces: true
            private_chat_portal_meta: true
            bridge_status_notices: errors
            # Local stack: only users on the local domain may use the bridge;
            # the first admin user gets full bridge admin rights.
            permissions:
              '*': relay
              matrix.icylair.com: user
              '@admin:matrix.icylair.com': admin
              '@bornav:matrix.icylair.com': admin
          homeserver:
            address: http://synapse-matrix-synapse.apps-matrix:8008
            domain: matrix.icylair.com
            websocket: false
            ping_interval_seconds: 5
          network:
            history_sync:
              # Create portal rooms for all conversations in the history sync blobs.
              max_initial_conversations: -1
              # Ask the phone for ~1 year of history instead of ~3 months.
              request_full_sync: true
              # Values mirror the prod matrix.icylair.com bridge config.
              full_sync_config:
                days_limit: 900
                size_mb_limit: 30000
                storage_quota_mb: 30000
              media_requests:
                auto_request_media: true
                request_method: immediate
                request_local_time: 120
                max_async_handle: 4
          backfill:
            # WhatsApp history sync blobs are sent once per pairing; with this
            # disabled they are dropped (docs: logout+login to re-receive).
            enabled: true
            # Limits mirror the prod matrix.icylair.com bridge config.
            max_initial_messages: 5000
            max_catchup_messages: 50000
            unread_hours_threshold: 7200
          matrix:
            message_status_events: false
            delivery_receipts: false
            message_error_notices: true
            sync_direct_chat_list: true
            federate_rooms: true
            upload_file_threshold: 5242880
          appservice:
            address: http://matrix-whatsapp-bridge.apps-matrix:29318
            hostname: 0.0.0.0
            port: 29318
            id: whatsapp
            bot:
              username: whatsappbot
              displayname: WhatsApp bridge bot
            ephemeral_events: true
            async_transactions: false
            as_token: '{{ .as_token }}'
            hs_token: '{{ .hs_token }}'
            # {{ "{{.}}" }} renders the literal Go-template placeholder that
            # mautrix itself uses for puppet MXIDs.
            username_template: 'whatsapp_{{ "{{.}}" }}'
          database:
            uri: postgres://synapse:{{ .db_password }}@matrix-pg-rw/whatsapp?sslmode=disable
          encryption:
            allow: true
            default: false
            require: false
            # Local synapse delegates auth to MAS (MSC3861), so appservice
            # login is unavailable; the bridge bot device must be created
            # via MSC4190 instead. (Prod synapse has classic auth, false there.)
            msc4190: true
            pickle_key: '{{ .pickle_key }}'
          analytics:
            token: null
          provisioning:
            prefix: /_matrix/provision
            shared_secret: '{{ .provision_shared_secret }}'
            allow_matrix_auth: true
            debug_endpoints: false
          logging:
            min_level: info
            writers:
              - type: stdout
                format: pretty-colored
        # Registration file consumed by Synapse via app_service_config_files.
        whatsapp-registration.yaml: |
          id: whatsapp
          url: http://matrix-whatsapp-bridge.apps-matrix:29318
          as_token: '{{ .as_token }}'
          hs_token: '{{ .hs_token }}'
          sender_localpart: '{{ .sender_localpart }}'
          rate_limited: false
          # Required with MAS-delegated auth: lets the bridge manage its bot
          # device via MSC4190 instead of appservice login.
          io.element.msc4190: true
          namespaces:
            users:
              - exclusive: true
                regex: '^@whatsappbot:matrix\.icylair\.com$'
              - exclusive: true
                regex: '^@whatsapp_.*:matrix\.icylair\.com$'
  data:
    - secretKey: as_token
      remoteRef:
        key: prod/apps/whatsapp-bridge
        property: as_token
    - secretKey: hs_token
      remoteRef:
        key: prod/apps/whatsapp-bridge
        property: hs_token
    - secretKey: sender_localpart
      remoteRef:
        key: prod/apps/whatsapp-bridge
        property: sender_localpart
    - secretKey: pickle_key
      remoteRef:
        key: prod/apps/whatsapp-bridge
        property: pickle_key
    - secretKey: db_password
      remoteRef:
        # Merged cluster: the bridge shares the single `synapse` role of
        # matrix-pg (password from postgres-synapse-user, same as synapse/MAS).
        key: prod/apps/synapse-ext-new
        property: password
    - secretKey: provision_shared_secret
      remoteRef:
        key: prod/apps/whatsapp-bridge
        property: provision_shared_secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Synapse media store -> S3 fallback (mirrors prod's aws-bucket-storage):
# s3-storage-provider.yaml is mounted directly into synapse conf.d.
# store_local+store_remote: media is written to the local disk AND uploaded
# to rustfs; after a restart onto a clean volume, downloads fetch from S3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-media-storage
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: s3-media-storage
    template:
      engineVersion: v2
      data:
        s3-storage-provider.yaml: |
          media_storage_providers:
          - module: s3_storage_provider.S3StorageProviderBackend
            store_local: True
            store_remote: True
            store_synchronous: false
            config:
              bucket: {{ .bucket }}
              prefix: {{ .bucket_prefix }}
              endpoint_url: {{ .endpoint_url_cloud }}
              region_name: us-west-1
              access_key_id: {{ .aws_access_key_id }}
              secret_access_key: {{ .aws_secret_access_key }}
  dataFrom:
    # One clusters entry now carries both endpoint variants: endpoint_url is the
    # local rustfs view (10.2.11.200, what barman used pre-cutover), endpoint_url_cloud
    # is the cloud rustfs view 10.53.255.254 (same instance). Creds/bucket(nobackup)/
    # prefix(matrix-s3-storage/synapse/) unchanged. Media store is SHARED — zero
    # migration at cutover.
    - extract:
        key: prod/apps/s3-media-secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# S3 credentials for the CNPG barman-cloud plugin (ObjectStore matrix-pg).
# Deliberately NOT rustfs-cnpg-local-token: that token is denied on the
# `postgres/cluster-cloud/...` archive prefix (AccessDenied on multipart
# upload), while the matrix s3-media creds have read+write on the whole
# `backups` bucket incl. cluster-cloud. Same Vault entry as s3-media-storage
# (prod/apps/s3-media-secret); the template picks only the two keys the
# barman-cloud plugin ObjectStore expects, so the endpoint fields are ignored.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-pg-barman-creds
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: matrix-pg-barman-creds
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .aws_secret_access_key }}"
  dataFrom:
    - extract:
        key: prod/apps/s3-media-secret
