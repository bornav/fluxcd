---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# App layer only — the DB layer lives in ./databases and is applied by the
# matrix-databases Kustomization; matrix-apps dependsOn it so nothing here
# (synapse, MAS, bridge, routes) is even applied before Postgres is healthy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps-matrix
resources:
  - configmap-synapse.yaml
  - release-mas.yaml
  - release-synapse.yaml
  - httproute-oidc.yaml
  - bridge-whatsapp.yaml
  # (b) scoped https redirect/security headers + git-owned matrix route
  - middleware-https.yaml
  - httproute-matrix.yaml
