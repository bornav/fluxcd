---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# htpasswd users for the dashboard basic-auth middleware. Was a SOPS Secret;
# value now lives in the clusters/prod KV mount at prod/apps/dashboard-auth
# (field: users). Same entry feeds the jenkins copy in devops-tools ns.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashboard-auth
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: dashboard-auth
    template:
      engineVersion: v2
      data:
        users: "{{ .users }}"
  dataFrom:
    - extract:
        key: prod/apps/dashboard-auth
