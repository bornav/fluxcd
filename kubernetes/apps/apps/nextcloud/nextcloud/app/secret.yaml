---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Nextcloud admin account. Was a SOPS Secret; now clusters/prod KV entry
# prod/apps/nextcloud-secret. NOTE: values are demo-grade (unchanged, no
# rotation here) -- regenerate before ever re-enabling the nextcloud ks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: nextcloud-secret
    template:
      engineVersion: v2
      data:
        admin-name: '{{ index . "admin-name" }}'
        admin-pass: '{{ index . "admin-pass" }}'
  dataFrom:
    - extract:
        key: prod/apps/nextcloud-secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Nextcloud postgres credentials. Was a SOPS Secret; now clusters/prod KV entry
# prod/apps/postgres-secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    template:
      engineVersion: v2
      data:
        db-name: '{{ index . "db-name" }}'
        db-username: '{{ index . "db-username" }}'
        db-password: '{{ index . "db-password" }}'
  dataFrom:
    - extract:
        key: prod/apps/postgres-secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# restic target for nextcloud data (volsync). Was a SOPS Secret; now
# clusters/prod KV entry prod/apps/restic-nextcloud-data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-nextcloud-data
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: restic-nextcloud-data
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: "{{ .RESTIC_REPOSITORY }}"
  dataFrom:
    - extract:
        key: prod/apps/restic-nextcloud-data
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# restic target for nextcloud database (volsync). Was a SOPS Secret; now
# clusters/prod KV entry prod/apps/restic-nextcloud-database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-nextcloud-database
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: restic-nextcloud-database
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: "{{ .RESTIC_REPOSITORY }}"
  dataFrom:
    - extract:
        key: prod/apps/restic-nextcloud-database
