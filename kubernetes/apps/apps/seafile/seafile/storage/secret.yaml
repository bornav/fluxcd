---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Seafile mariadb + admin credentials. Was a SOPS Secret; now clusters/prod KV
# entry prod/apps/seafile-secret. NOTE: demo-grade values (unchanged, no
# rotation here) -- regenerate before ever re-enabling the seafile ks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seafile-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: seafile-secret
    template:
      engineVersion: v2
      data:
        DB_HOST: "{{ .DB_HOST }}"
        MARIADB_ROOT_PASSWORD: "{{ .MARIADB_ROOT_PASSWORD }}"
        SEAFILE_ADMIN_EMAIL: "{{ .SEAFILE_ADMIN_EMAIL }}"
        SEAFILE_ADMIN_PASSWORD: "{{ .SEAFILE_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: prod/apps/seafile-secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# restic target for seafile data (volsync). Was a SOPS Secret; now clusters/prod
# KV entry prod/apps/restic-seafile-data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-seafile-data
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: restic-seafile-data
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: "{{ .RESTIC_REPOSITORY }}"
  dataFrom:
    - extract:
        key: prod/apps/restic-seafile-data
