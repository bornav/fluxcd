---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
data:
  server.yml: |
    base-url: "https://ntfy.icylair.com"
    # Unprivileged port: the container runs as non-root, so :80 is not
    # bindable without CAP_NET_BIND_SERVICE. The Service maps 80 -> 8080.
    listen-http: ":8080"
    behind-proxy: true

    # Message cache on disk so phones reconnecting after a restart (or after
    # the phone slept) can fetch missed notifications with since=... .
    # Only metadata-ish messages anyway (UnifiedPush payloads are small).
    cache-file: "/var/lib/ntfy/cache.db"
    cache-duration: "24h"

    # UnifiedPush: count publishes on "up*" topics against the subscriber's
    # (the phone's) visitor quota instead of an anonymous publisher's, so
    # synapse pushing for an offline phone cannot be abused for spam.
    visitor-subscriber-rate-limiting: true

    # Keep the attack surface small: attachments stay disabled (no
    # attachment-cache-dir set), no Firebase/iOS instant delivery, no web
    # push, no SMTP, no metrics. Rate limits otherwise at ntfy defaults.
    global-topic-limit: 1000

    # Access control: private instance. Everyone else is denied by default;
    # the single exception is "up*" topics (UnifiedPush): the phone
    # subscribes as the logged-in ntfy user, but SYNAPSE publishes to the
    # up_<random> push URL anonymously, so anonymous clients need rw there.
    # Security model for up*: capability-by-URL (unguessable random topic).
    # The admin user (bornav) is provisioned declaratively via the
    # NTFY_AUTH_USERS env var (bcrypt hash from Vault -> ntfy-secrets
    # ExternalSecret), never stored in git.
    auth-file: "/var/lib/ntfy/user.db"
    auth-default-access: "deny-all"
    auth-access:
      - "*:up*:rw"
