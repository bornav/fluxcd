base-url: "https://ntfy.icylair.com"
# Unprivileged port: the container runs as non-root, so :80 is not
# bindable without CAP_NET_BIND_SERVICE. The Service maps 80 -> 8080.
listen-http: ":8080"
behind-proxy: true

# Message cache on disk so phones reconnecting after a restart (or after
# the phone slept) can fetch missed notifications with since=... .
# Only metadata-ish messages anyway (UnifiedPush payloads are small).
cache-file: "/var/lib/ntfy/cache.db"
cache-duration: "24h"

# --- access control: private instance ---------------------------------
# deny-all: the public sees NOTHING unless explicitly allowed below.
# The single anonymous exception is "up*" topics (UnifiedPush): the
# phone subscribes as the logged-in ntfy user, but SYNAPSE publishes to
# the up_<random> push URL anonymously, so anonymous clients need rw
# there. Security model for up*: capability-by-URL (unguessable random
# topic, 14 chars). The admin user (bornav) is provisioned declaratively
# via NTFY_AUTH_USERS (bcrypt hash from Vault -> ntfy-secrets
# ExternalSecret), never stored in git.
auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"
auth-access:
  - "*:up*:rw"

# --- attack surface: kill everything we don't use ---------------------
# Web app moved OFF the root path to "/app" (NOT fully disabled). Reason:
# the UnifiedPush discovery route GET /<topic>?up=1 is dispatched via
# handleTopic which is gated by ensureWebEnabled -- web-root "disable"
# (WebRoot=="") 404s that route and BREAKS distributor registration
# (verified live: discovery returned 404). "/app" keeps ensureWebEnabled
# satisfied (so ?up=1 discovery AND the app's /v1/config work) while the
# obvious root "/" falls through to 404 (root SPA only served when
# WebRoot=="/" -- verified server.go:770). SPA at /app is inert anyway
# (deny-all + signup off). Flip to "disable" only if you drop UnifiedPush.
web-root: "/app"
# Account self-service OFF everywhere (signup endpoint 400s even via
# API; verified in server_account.go handleAccountCreate). Basic-auth
# login for the provisioned user is NOT affected by these flags --
# enable-login/require-login only shape the (now disabled) web UI.
enable-signup: false
enable-login: false
require-login: false
enable-reservations: false
# Attachments stay OFF (no attachment-cache-dir): no file uploads, no
# storage-exhaustion vector, no malware hosting. Upstream/base-url to
# ntfy.sh stays OFF (no data leaves the box; no Firebase dependency).
# SMTP, web-push, metrics, templates: all unset => off.
message-size-limit: "4k"

# --- rate limits: assume hostile internet ------------------------------
# UnifiedPush: count publishes on "up*" topics against the subscriber's
# (the phone's) visitor quota instead of an anonymous publisher's, so
# synapse pushing for an offline phone cannot be abused for spam.
visitor-subscriber-rate-limiting: true

# Per-visitor (IP) request bucket: default burst 60/5s replenish.
# Burst 40 is generous for mobile reconnect/poll bursts.
# NO exempt-hosts on purpose: with visitor-subscriber-rate-limiting
# above, synapse's up_ publishes count against the phone's quota, not
# synapse's, so no in-cluster exemption is needed -- and an exemption
# would be XFF-spoofable (an attacker sending "X-Forwarded-For:
# <exempt-ip>" would land in an exempt bucket). ntfy takes the
# right-most non-trusted XFF entry (verified in server/util.go
# extractIPAddress), which is the one traefik appended, so plain client
# IPs are already derived correctly without any exemptions.
visitor-request-limit-burst: 40
visitor-request-limit-replenish: "5s"

# Per-visitor subscriptions (SSE/poll/websocket): default 30, we need a
# handful (phone app + maybe curl sessions).
visitor-subscription-limit: 10

# Per-visitor hard daily message quota (persisted in user.db => survives
# restarts). 1000/day per IP is far beyond personal use; caps spam-out.
visitor-message-daily-limit: 1000

# Per-visitor new-topic creation: caps topic squatting/enumeration.
# Default 100/min; 20 is plenty (each real topic is created once).
visitor-topic-creation-limit-burst: 20
visitor-topic-creation-limit-replenish: "1m"

# Global topic count cap: attacker spraying random up_<random> topics
# (anonymous rw) can't grow the topic map unbounded.
global-topic-limit: 1000

# Abuse ban-feed: abusive IPs (weighted 403/429/etc. strikes per 10m
# window, threshold 100 -- defaults incl. sensible UnifiedPush weights)
# are appended here for fail2ban-style consumption. File lives on the
# PVC (writable); rotate/truncate if it ever grows. Currently consumed
# by nobody -- telemetry only; see memory.md for the follow-up.
ban-file: "/var/lib/ntfy/ban.log"
