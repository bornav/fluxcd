---
# ntfy admin user (bcrypt hash, NOT the plaintext password) for declarative
# provisioning via NTFY_AUTH_USERS. Stored in Vault at
# secret/ntfy-local/ntfy-auth (field auth_users = "bornav:<bcrypt-hash>:admin";
# the field "password" holds the plaintext for the user's own reference and is
# never read by the manifests). Generated with `ntfy user hash` -- nothing
# existing was rotated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend-cross-namespaces-secret
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ntfy-secrets
  data:
    - secretKey: auth_users
      remoteRef:
        key: ntfy-local/ntfy-auth
        property: auth_users
