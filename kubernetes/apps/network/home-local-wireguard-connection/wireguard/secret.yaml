---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# WireGuard keypair for the home-local exit node. Was a SOPS Secret; now the
# clusters/prod KV entry prod/networking/wireguard-keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wireguard-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: wireguard-keys
    template:
      engineVersion: v2
      data:
        privateKey: "{{ .privateKey }}"
        publicKey: "{{ .publicKey }}"
  dataFrom:
    - extract:
        key: prod/networking/wireguard-keys
