---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# restic target for portainer config backups (volsync backup ks is commented
# out; kept in sync so re-enabling it works). Was a SOPS Secret; now
# clusters/prod KV entry prod/observability/restic-portainer-data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-portainer-config-data
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: restic-portainer-config-data
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: "{{ .RESTIC_REPOSITORY }}"
  dataFrom:
    - extract:
        key: prod/observability/restic-portainer-data
