---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# oauth2-proxy config for kubernetes-dashboard. Was a SOPS Secret; now the
# clusters/prod KV entry prod/observability/oauth2-proxy-secret (mirrors
# clusters/local/observability/oauth2-proxy-secret; REDIRECT_URL/UPSTREAM
# intentionally differ per cluster).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-secret
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_ID: "{{ .OAUTH2_PROXY_CLIENT_ID }}"
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .OAUTH2_PROXY_CLIENT_SECRET }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .OAUTH2_PROXY_COOKIE_SECRET }}"
        OAUTH2_PROXY_GROUPS_CLAIM: "{{ .OAUTH2_PROXY_GROUPS_CLAIM }}"
        OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "{{ .OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL }}"
        OAUTH2_PROXY_OIDC_EMAIL_CLAIM: "{{ .OAUTH2_PROXY_OIDC_EMAIL_CLAIM }}"
        OAUTH2_PROXY_OIDC_ISSUER_URL: "{{ .OAUTH2_PROXY_OIDC_ISSUER_URL }}"
        OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "{{ .OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER }}"
        OAUTH2_PROXY_REDIRECT_URL: "{{ .OAUTH2_PROXY_REDIRECT_URL }}"
        OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "{{ .OAUTH2_PROXY_SET_AUTHORIZATION_HEADER }}"
        OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "{{ .OAUTH2_PROXY_SKIP_PROVIDER_BUTTON }}"
        OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "{{ .OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY }}"
        OAUTH2_PROXY_SSL_UPSTREAM_INSECURE_SKIP_VERIFY: "{{ .OAUTH2_PROXY_SSL_UPSTREAM_INSECURE_SKIP_VERIFY }}"
        OAUTH2_PROXY_UPSTREAM: "{{ .OAUTH2_PROXY_UPSTREAM }}"
  dataFrom:
    - extract:
        key: prod/observability/oauth2-proxy-secret
