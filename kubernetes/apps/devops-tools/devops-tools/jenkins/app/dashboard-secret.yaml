---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Jenkins dashboard basic-auth. Was a SOPS Secret (identical value to the
# dashboard-app one); shares the same clusters/prod entry prod/apps/dashboard-auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashboard-auth
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: dashboard-auth
    template:
      engineVersion: v2
      data:
        users: "{{ .users }}"
  dataFrom:
    - extract:
        key: prod/apps/dashboard-auth
