---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs
spec:
  interval: 15m
  url: https://openebs.github.io/openebs
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 15m
  chart:
    spec:
      chart: openebs
      version: 4.5.1
      sourceRef:
        kind: HelmRepository
        name: openebs
        # namespace: storage
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    alloy:
      enabled: false
    loki:
      enabled: false

    localpv-provisioner:
      analytics:
        enabled: false

    engines:
      local:
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
