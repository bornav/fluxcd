---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
# RBAC layer: cluster-wide read + namespace-scoped delete rights. Separate
# Kustomization because its RoleBindings must live in the TARGET namespaces
# (xauth, apps-matrix) — kustomize's namespace: stanza in app/ would rewrite
# them, so this dir carries no namespace transformer and pins namespaces by
# hand. Watchdog itself lives in the storage namespace (CNPG operator's home).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-watchdog-rbac
  namespace: flux-system
spec:
  path: ./kubernetes/apps/storage/cnpg-watchdog/cnpg-watchdog/rbac
  prune: true
  suspend: false
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  interval: 15m
  retryInterval: 15m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# App layer: SA + state ConfigMap rights + Deployment + NetworkPolicy, all in
# the storage namespace. DEPLOYED but DRY_RUN=true: it detects, logs and
# sends ntfy notifications, but NEVER deletes anything. Remediation becomes
# real only when DRY_RUN is flipped to false in app/configmap.yaml (after
# observing the dry-run notifications on the ntfy cnpg-watchdog topic).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-watchdog
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-watchdog-rbac
  path: ./kubernetes/apps/storage/cnpg-watchdog/cnpg-watchdog/app
  prune: true
  suspend: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  interval: 15m
  retryInterval: 15m
  timeout: 5m
