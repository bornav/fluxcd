---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Lives in the storage namespace (same home as the CNPG operator itself).
# The namespace: stanza stamps every namespaced resource here; the storage
# Namespace object is owned by ../storage/namespace.yaml, not by this app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storage
resources:
  - externalsecret-ntfy.yaml
  - configmap.yaml
  - deployment.yaml
  - networkpolicy.yaml
