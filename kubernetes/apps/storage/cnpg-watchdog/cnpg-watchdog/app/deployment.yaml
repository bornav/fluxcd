---
# yaml-language-server: $schema=https://json.schemastore.org/deployment
# cnpg-watchdog: detects CNPG replica instances crashlooping on WAL/backing
# store failures and (when all safety gates pass) deletes pod+PVCs so the
# operator rebuilds the replica from the healthy primary.
#
# Source: https://git.icylair.com/bornav/cnpg-watchdog (tools image built
# from that repo; build recipe in its Dockerfile).
#
# Single replica on purpose: the state ConfigMap (stuck clock + cooldowns)
# has no leader election — two copies would race.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-watchdog
  labels:
    app: cnpg-watchdog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cnpg-watchdog
  template:
    metadata:
      labels:
        app: cnpg-watchdog
    spec:
      serviceAccountName: cnpg-watchdog
      # No node pinning: the loop is 60s, stateless between ticks except the
      # state ConfigMap; it can run anywhere.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      containers:
        - name: cnpg-watchdog
          image: harbor.icylair.com/library/cnpg-watchdog:v0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: cnpg-watchdog-config
            - secretRef:
                name: cnpg-watchdog-ntfy
                optional: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # No probes: the image is FROM scratch (no shell/kill for exec
          # probes, no HTTP surface for httpGet). Process death already
          # triggers a container restart via the runtime.
