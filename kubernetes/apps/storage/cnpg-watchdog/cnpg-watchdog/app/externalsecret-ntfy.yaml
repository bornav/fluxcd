---
# ntfy credentials for publishing to the cnpg-watchdog topic.
#
# ntfy runs auth-default-access: deny-all and only "*:up*" is anonymous, so
# publishing to a named topic needs an authenticated user. This reuses the
# admin user (bornav) whose bcrypt hash is provisioned from Vault by
# ntfy-secrets. Vault entry clusters/prod/apps/ntfy-auth field "password"
# holds the plaintext (see apps/ntify/externalsecret-ntfy.yaml).
#
# If you would rather not let this service hold the admin password, create a
# dedicated ntfy user (ntfy user add --role user cnpg-bot) and a Vault entry
# clusters/prod/apps/cnpg-watchdog-auth with user/password fields, then point
# the remoteRef below at it. The Deployment reads NTFY_USER/NTFY_PASS either way.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-watchdog-ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend-clusters-prod
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: cnpg-watchdog-ntfy
  data:
    # secretKey doubles as the env name via envFrom (binary reads NTFY_PASS).
    - secretKey: NTFY_PASS
      remoteRef:
        key: prod/apps/ntfy-auth
        property: password
