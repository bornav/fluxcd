---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# restic target for harbor volume backups. Was a SOPS Secret; now clusters/prod
# KV entry prod/storage/restic-harbor-data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-harbor-data
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: restic-harbor-data
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: "{{ .RESTIC_REPOSITORY }}"
  dataFrom:
    - extract:
        key: prod/storage/restic-harbor-data
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Harbor core credentials (admin, registry S3, postgres, replication). Was a
# SOPS Secret; now clusters/prod KV entry prod/storage/harbor-secret (leaf name
# parity with clusters/local/storage/harbor-secret; dashed keys via index).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: harbor-secret
    template:
      engineVersion: v2
      data:
        HARBOR_ADMIN_PASSWORD: "{{ .HARBOR_ADMIN_PASSWORD }}"
        REGISTRY_STORAGE_S3_ACCESSKEY: "{{ .REGISTRY_STORAGE_S3_ACCESSKEY }}"
        REGISTRY_STORAGE_S3_SECRETKEY: "{{ .REGISTRY_STORAGE_S3_SECRETKEY }}"
        password: '{{ index . "password" }}'
        postgres-password: '{{ index . "postgres-password" }}'
        replication-password: '{{ index . "replication-password" }}'
  dataFrom:
    - extract:
        key: prod/storage/harbor-secret
