---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Longhorn CIFS backup store credentials. Was a SOPS Secret; now clusters/prod
# KV entry prod/storage/cifs-secret (field parity with
# clusters/local/storage/cifs-secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cifs-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: cifs-secret
    template:
      engineVersion: v2
      data:
        CIFS_USERNAME: "{{ .CIFS_USERNAME }}"
        CIFS_PASSWORD: "{{ .CIFS_PASSWORD }}"
  dataFrom:
    - extract:
        key: prod/storage/cifs-secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Longhorn S3 (MinIO) backup store credentials. Was a SOPS Secret; now
# clusters/prod KV entry prod/storage/s3-minio-secret (same values as
# clusters/local/storage/s3-minio-secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-minio-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend-clusters-prod
    kind: ClusterSecretStore
  target:
    name: s3-minio-secret
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        AWS_ENDPOINTS: "{{ .AWS_ENDPOINTS }}"
  dataFrom:
    - extract:
        key: prod/storage/s3-minio-secret
